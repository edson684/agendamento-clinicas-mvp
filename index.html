<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MVP · Agendamento para Clínicas</title>
<style>
:root{--bg:#f6f7f9;--fg:#1b2430;--card:#fff;--mut:#667085;--ac:#0f766e;--bd:#dde1e7;--bad:#b42318;--ok:#067647}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--fg:#e8ecf1;--card:#18202a;--mut:#98a2b3;--ac:#2dd4bf;--bd:#2a3441;--bad:#f97066;--ok:#47cd89}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:760px;margin:auto;padding:12px}h1{font-size:17px;margin:0 0 8px}h2{font-size:15px;margin:10px 0 6px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0}
select,input,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%;margin:2px}
button{cursor:pointer}button.p,.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs{display:flex;gap:4px;overflow-x:auto}.m{color:var(--mut);font-size:13px}.bad{color:var(--bad)}.ok{color:var(--ok)}
.toast{padding:8px 10px;border-radius:8px;color:#fff;margin:8px 0}.toast.bad{background:var(--bad)}.toast.okm{background:var(--ok)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:left}
</style></head><body><main>
<h1>🩺 MVP · Agendamento para Clínicas <span class="m">monólito modular · 4 camadas · 7 módulos</span></h1>
<div id="app">Carregando…</div></main>
<script type="module">
  // Raiz de composição no navegador: monta o monólito, carrega dados de demonstração e liga a interface.
  import { createApp } from './src/main.js';
  import { seedDemo, DEMO_PASSWORD } from './src/seed.js';
  import { MODULE_DEPENDENCIES } from './src/modules.js';
  import { mountUi } from './src/presentation/web/ui.js';
  const app = createApp({ hasherIterations: 20_000 });
  const users = await seedDemo(app);
  mountUi(document.getElementById('app'), app.controllers, { users, senha: DEMO_PASSWORD, manifest: MODULE_DEPENDENCIES });
</script></body></html>
